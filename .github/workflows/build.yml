name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Install dependencies
        run: |
          pip install flet==0.24.1 requests beautifulsoup4

      - name: Build APK with Flet
        run: |
          flet build apk --project "BarbargBandar" --description "Senator Plus Barbarg App"

      - name: Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: Barbarg-Bandar-APK
          path: build/apk/*.apk
