name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Flet CLI
      run: |
        pip install --upgrade pip
        pip install flet

    - name: Build APK
      run: |
        flet pack main.py --pirate

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Barbarg-Bandar-APK
        path: dist/*.apk
