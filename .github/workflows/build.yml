name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Buildozer and Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev libsqlite3-dev libssl-dev libffi-dev liblzma-dev
        pip install --upgrade pip
        pip install buildozer cython==0.29.36

    - name: Initialize Buildozer
      run: |
        buildozer init || true

    - name: Build APK with Buildozer
      run: |
        # تنظیم خودکار نام برنامه در فایل کانفیگ
        sed -i 's/# title = My Application/title = Barbarg Bandar/g' buildozer.spec
        sed -i 's/# package.name = myapp/package.name = barbargbandar/g' buildozer.spec
        sed -i 's/# package.domain = org.example/package.domain = com.barbarg/g' buildozer.spec
        sed -i 's/# requirements = python3,kivy/requirements = python3,flet,httpx,requests/g' buildozer.spec
        
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Barbarg-Bandar-APK
        path: bin/*.apk
